              </div>
              <label class="range-field background-opacity-field">
                <span>背景图片透明度 <strong id="backgroundOpacityValue">100%</strong></span>
                <input id="backgroundOpacityRange" type="range" min="0" max="100" value="100" />
              </label>
              <div class="number-grid">
                <label>
                  <span>画布宽度</span>
                  <input id="canvasWidthInput" type="number" min="64" max="12000" value="1080" inputmode="numeric" />
                </label>
                <label>
                  <span>画布高度</span>
                  <input id="canvasHeightInput" type="number" min="64" max="12000" value="1080" inputmode="numeric" />
                </label>
              </div>
              <div class="field-grid">
                <label>
                  <span>背景色</span>
                  <input id="backgroundColorInput" class="color-input" type="color" value="#ffffff" />
                </label>
                <label>
                  <span>图片适配</span>
                  <select id="backgroundFitSelect">
                    <option value="cover">铺满裁剪</option>
                    <option value="contain">适应画布</option>
                    <option value="stretch">拉伸填充</option>
                  </select>
                </label>
              </div>
              <input id="backgroundFileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            </div>

            <div class="property-card text-property-card hidden" id="textPropertyCard">
              <label class="wide-field text-content-field">
                <span>文字内容</span>
                <textarea id="textContentInput" rows="4" placeholder="选中文本框后编辑内容"></textarea>
              </label>
              <div class="text-metric-grid">
                <label>
                  <span>字号</span>
                  <input id="fontSizeInput" type="number" min="8" max="400" value="48" inputmode="numeric" />
                </label>
                <label>
                  <span>字距</span>
                  <input id="letterSpacingInput" type="number" min="-100" max="500" step="1" value="0" inputmode="decimal" />
                </label>
                <label>
                  <span>行距</span>
                  <input id="lineHeightInput" type="number" min="0.8" max="3" step="0.05" value="1.25" inputmode="decimal" />
                </label>
              </div>
              <div class="field-grid">
                <label>

                    <option value="Source Han Sans SC">思源黑体</option>

                  </select>
                </label>
                <label>

                  <input id="textColorInput" class="color-input" type="color" value="#0f172a" />
