<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片工具入口</title>
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <main class="home-shell">
      <header class="home-header">
        <h1>煊原集团 - 内部图片工具</h1>
      </header>

      <section class="entry-panel" aria-label="工具入口">
        <a class="entry-card" href="/batch/">
          <span class="entry-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16" />
              <path d="M4 12h16" />
              <path d="M4 17h10" />
              <path d="M17 15l3 3" />
              <path d="M20 15l-3 3" />
            </svg>
          </span>
          <span class="entry-copy">
            <strong>图片处理工具</strong>
            <small>调整尺寸、转换格式、压缩图片大小</small>
          </span>
        </a>

        <a class="entry-card" href="/ai/">
          <span class="entry-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
              <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" />
              <path d="M5 14l.7 1.8L8 16.5l-2.3.7L5 19l-.7-1.8L2 16.5l2.3-.7z" />
            </svg>
          </span>
          <span class="entry-copy">
            <strong>AI 图片工作台</strong>
            <small>AI抠图，AI修图，AI高清放大</small>
          </span>
        </a>

        <a class="entry-card" href="/crop/">
          <span class="entry-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6 3v12a3 3 0 0 0 3 3h12" />
              <path d="M3 6h12a3 3 0 0 1 3 3v12" />
              <path d="M8 8h8v8H8z" />
            </svg>
          </span>
          <span class="entry-copy">
            <strong>裁切工具</strong>
            <small>手动裁切、参考线切片、ZIP导出</small>
          </span>
        </a>

        <a class="entry-card" href="/layout/">
          <span class="entry-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 5h16v14H4z" />
              <path d="M8 9h8" />
              <path d="M10 9v7" />
              <path d="M8 16h8" />
            </svg>
          </span>
          <span class="entry-copy">
            <strong>简单排版工具</strong>
            <small>背景图片、文本框排版、导出图片</small>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
