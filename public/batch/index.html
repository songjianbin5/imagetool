<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片处理工具 煊原集团内部工具</title>
  <link rel="stylesheet" href="/batch/styles.css?v=20260602-1723">
  <script defer src="/batch/script.js?v=20260602-1723"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="app-shell">
    <section class="panel hero-panel">
      <div class="hero-copy">
        <h1 class="hero-title">
          <span>图片处理工具</span>
          <span class="hero-title-sub">煊原集团内部工具</span>
        </h1>
      </div>
    </section>

    <section class="workspace">
      <aside class="controls-column">
        <section class="panel upload-panel">
          <div class="section-head">
            <h2>上传图片</h2>
            <span class="count-pill" id="fileCountPill">0 张</span>
          </div>

          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
            <span class="dropzone-icon" aria-hidden="true">
              <svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                <path d="M576 282.496V704a64 64 0 0 1-128 0V282.496L301.248 429.248a64 64 0 0 1-90.496-90.496l256-256a64 64 0 0 1 90.496 0l256 256a64 64 0 1 1-90.496 90.496L576 282.496zM1024 704v256a64 64 0 0 1-64 64H64a64 64 0 0 1-64-64v-256a64 64 0 0 1 128 0v192h768v-192a64 64 0 0 1 128 0z" fill="#005AEC"></path>
              </svg>
            </span>
            <strong>拖入图片，或点这里选择文件</strong>
          </label>

          <div class="file-list-shell">
            <div class="toolbar-row list-toolbar">
              <button class="ghost-button" type="button" id="clearFilesButton">清空列表</button>
            </div>

            <div class="file-list" id="fileList">
              <div class="empty-state">
                <strong>还没有图片</strong>
              </div>
            </div>
          </div>
        </section>

        <section class="panel controls-panel">
          <div class="section-head">
            <h2>组合动作</h2>
            <span class="count-pill subtle" id="referencePill">未选参考图</span>
          </div>

          <article class="tool-card preset-card is-collapsed" id="presetCard">
            <label class="switch-row" for="enablePreset">
              <span class="step-heading">
                <span class="step-badge">P</span>
                <span class="step-copy">
                  <strong>预设</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enablePreset" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <div class="preset-layout">
                <label class="field">
                  <span>预设列表</span>
                  <select id="presetSelect">
                    <option value="">选择预设</option>
                  </select>
                </label>

                <label class="field">
                  <span>预设名称</span>
                  <input id="presetNameInput" type="text" maxlength="40" placeholder="输入预设名称">
                </label>

                <div class="preset-buttons preset-buttons-start">
                  <button class="ghost-button" type="button" id="savePresetButton">保存当前为预设</button>
                </div>
                <div class="preset-buttons">
                  <button class="ghost-button" type="button" id="deletePresetButton">删除当前预设</button>
                </div>
              </div>
            </div>
          </article>

          <article class="tool-card is-collapsed" id="trimCard">
            <label class="switch-row" for="enableTrim">
              <span class="step-heading">
                <span class="step-badge">01</span>
                <span class="step-copy">
                  <strong>裁切透明边</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enableTrim" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <label class="field">
                <span>Alpha 阈值</span>
                <input id="trimAlphaThreshold" type="number" min="0" max="255" step="1" value="0" inputmode="numeric">
              </label>
            </div>
          </article>

          <article class="tool-card is-collapsed" id="resizeCard">
            <label class="switch-row" for="enableResize">
              <span class="step-heading">
                <span class="step-badge">02</span>
                <span class="step-copy">
                  <strong>调整尺寸</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enableResize" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <div class="field-grid two-col">
                <label class="field">
                  <span>宽度</span>
                  <input id="resizeWidth" type="number" min="1" inputmode="numeric" placeholder="例如 1600">
                </label>
                <label class="field">
                  <span>高度</span>
                  <input id="resizeHeight" type="number" min="1" inputmode="numeric" placeholder="例如 900">
                </label>
              </div>

              <label class="check-row" for="lockRatio">
                <input id="lockRatio" type="checkbox" checked>
                <span>锁定比例</span>
              </label>

              <p class="hint-text" id="resizeHint"></p>
            </div>
          </article>

          <article class="tool-card is-collapsed" id="canvasCard">
            <label class="switch-row" for="enableCanvas">
              <span class="step-heading">
                <span class="step-badge">03</span>
                <span class="step-copy">
                  <strong>修改画布</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enableCanvas" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <div class="field-grid two-col">
                <label class="field">
                  <span>画布宽度</span>
                  <input id="canvasWidth" type="number" min="1" inputmode="numeric" placeholder="例如 1920">
                </label>
                <label class="field">
                  <span>画布高度</span>
                  <input id="canvasHeight" type="number" min="1" inputmode="numeric" placeholder="例如 1080">
                </label>
              </div>

              <div class="field split-field">
                <span>锚点位置</span>
                <div class="anchor-grid" id="anchorGrid">
                  <button type="button" class="anchor-button" data-anchor="top-left" aria-label="左上"></button>
                  <button type="button" class="anchor-button" data-anchor="top-center" aria-label="上"></button>
                  <button type="button" class="anchor-button" data-anchor="top-right" aria-label="右上"></button>
                  <button type="button" class="anchor-button" data-anchor="center-left" aria-label="左"></button>
                  <button type="button" class="anchor-button is-active" data-anchor="center" aria-label="中心"></button>
                  <button type="button" class="anchor-button" data-anchor="center-right" aria-label="右"></button>
                  <button type="button" class="anchor-button" data-anchor="bottom-left" aria-label="左下"></button>
                  <button type="button" class="anchor-button" data-anchor="bottom-center" aria-label="下"></button>
                  <button type="button" class="anchor-button" data-anchor="bottom-right" aria-label="右下"></button>
                </div>
              </div>

              <label class="check-row" for="transparentCanvas">
                <input id="transparentCanvas" type="checkbox" checked>
                <span>透明背景</span>
              </label>

              <label class="field inline-field">
                <span>画布底色</span>
                <input id="canvasBgColor" type="color" value="#ffffff">
              </label>
            </div>
          </article>

          <article class="tool-card is-collapsed" id="outputCard">
            <label class="switch-row" for="enableOutput">
              <span class="step-heading">
                <span class="step-badge">04</span>
                <span class="step-copy">
                  <strong>格式转换 / 压缩</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enableOutput" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <div class="field-grid two-col">
                <label class="field">
                  <span>输出格式</span>
                  <select id="outputFormat">
                    <option value="original">保持原格式</option>
                    <option value="image/jpeg">JPG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WEBP</option>
                    <option value="image/gif">GIF</option>
                  </select>
                </label>
                <label class="field inline-field">
                  <span>透明填充色</span>
                  <input id="outputFillColor" type="color" value="#ffffff">
                </label>
              </div>

              <label class="field range-field" for="qualityRange">
                <span>压缩质量</span>
                <div class="range-wrap">
                  <input id="qualityRange" type="range" min="10" max="100" step="1" value="86">
                  <strong id="qualityValue">86%</strong>
                </div>
              </label>

            </div>
          </article>

          <article class="tool-card is-collapsed" id="overwriteCard">
            <label class="switch-row" for="enableOverwrite">
              <span class="step-heading">
                <span class="step-badge">05</span>
                <span class="step-copy">
                  <strong>覆盖替换</strong>
                </span>
              </span>
              <span class="switch">
                <input id="enableOverwrite" type="checkbox">
                <span class="switch-track"></span>
              </span>
            </label>

            <div class="tool-body">
              <label class="check-row" for="overwriteExisting">
                <input id="overwriteExisting" type="checkbox" checked>
                <span>覆盖同名文件</span>
              </label>

              <div class="field">
                <span>输出文件夹</span>
                <div class="export-target-row">
                  <button class="ghost-button" type="button" id="pickExportFolderButton">选择文件夹</button>
                  <span class="directory-chip" id="exportFolderLabel">未选择</span>
                </div>
              </div>

              <p class="hint-text" id="overwriteHint"></p>
            </div>
          </article>

          <div class="action-bar">
            <button class="primary-button" type="button" id="processButton">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
              开始处理
            </button>
            <button class="ghost-button" type="button" id="overwriteExportButton">覆盖写回</button>
            <button class="ghost-button" type="button" id="downloadAllButton">全部下载</button>
          </div>

          <div class="status-panel" id="statusPanel"></div>
        </section>
      </aside>

      <section class="stage-column">
        <section class="panel preview-panel">
          <div class="section-head preview-head">
            <div class="preview-head-main">
              <h2>前后预览</h2>
              <div class="panel-note" id="previewTitle">未选择图片</div>
            </div>
            <span class="count-pill subtle" id="previewMeta">-</span>
          </div>

          <div class="preview-grid">
            <article class="preview-card">
              <div class="preview-label">
                <strong>原图</strong>
                <span id="originalMeta">-</span>
              </div>
              <div class="preview-frame">
                <img id="originalPreview" alt="原图预览">
                <div class="preview-placeholder" id="originalPlaceholder">原图</div>
              </div>
            </article>

            <article class="preview-card">
              <div class="preview-label">
                <strong>处理后</strong>
                <span id="processedMeta">-</span>
              </div>
              <div class="preview-frame">
                <img id="processedPreview" alt="处理后预览">
                <div class="preview-placeholder" id="processedPlaceholder">结果</div>
              </div>
            </article>
          </div>
        </section>

        <section class="panel results-panel">
          <div class="section-head">
            <h2>结果列表</h2>
            <span class="count-pill" id="resultSummary">0 / 0 完成</span>
          </div>

          <div class="summary-strip" id="summaryStrip">
            <div>
              <span>原始体积</span>
              <strong id="totalOriginalSize">0 B</strong>
            </div>
            <div>
              <span>输出体积</span>
              <strong id="totalOutputSize">0 B</strong>
            </div>
            <div>
              <span>总体变化</span>
              <strong id="totalDelta">0%</strong>
            </div>
          </div>

          <div class="result-list" id="resultList">
            <div class="empty-state">
              <strong>结果会显示在这里</strong>
            </div>
          </div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
